hero:
  kicker: Cybersecurity Professional and Cofounder of <a href="https://cvq.no" target="_blank" rel="noopener noreferrer">CVQ</a>
  subheadline: >
    <p>My PhD research focused on securing <strong>critical infrastructure</strong>, healthcare, power grids, and industrial IoT. This work led to <strong><a href="https://github.com/khannmohsin/BlockCap" target="_blank" rel="noopener noreferrer">BlockCap</a></strong>, a system I developed for protecting <strong>resource-constrained devices</strong> in heterogeneous, hierarchical networks, along with a <strong><a href="https://github.com/khannmohsin/CryptoBench-RPi-Arduino_LWC" target="_blank" rel="noopener noreferrer">benchmarking framework</a></strong> for lightweight cryptography that ensures confidentiality, integrity, and access control.</p>
    <p>I'm also a cofounder of <strong><a href="https://cvq.no" target="_blank" rel="noopener noreferrer">CVQ</a></strong>, built in collaboration with the Tromsø municipality in Norway. CVQ connects local residents with the municipality, letting them vote on and shape public policy decisions.</p>
  portrait:
    path: assets/img/mohsin_khan.jpg
    alt: Mohsin Khan portrait
  ctas:
    - label: CV
      url: /cv/
      style: primary

threat_map:
  title: Signature View - Attack -> Control -> Signal
  intro: Threat-to-defense map across core intrusion stages.
  stages:
    - stage: Recon
      attack: OSINT, exposed assets.
      control: ASM, hardening.
      signal: Exposure alerts.
    - stage: Initial Access
      attack: Phishing, exploit creds.
      control: MFA, patching.
      signal: Risky login.
    - stage: Privilege Escalation
      attack: Role abuse, token theft.
      control: Least privilege, RBAC.
      signal: Role anomalies.
    - stage: Lateral Movement
      attack: Cred reuse, remote pivot.
      control: Segmentation, JIT.
      signal: East-west anomalies.
    - stage: Impact and Response
      attack: Ransomware, exfiltration.
      control: Immutable backups, IR playbooks.
      signal: Encryption alerts.

conversion:
  title: Open to Security Engineering and Research Collaboration
  body: >
    I collaborate on applied cybersecurity research, architecture reviews, and
    security engineering initiatives where distributed systems and real-world threat
    models matter.
