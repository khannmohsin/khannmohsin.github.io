cases:
  - category: Research and System Design
    title: BlockCap - Blockchain Capability Authorization for IoT
    url: /projects/dtea/
    challenge: >
      Secure authorization for constrained IoT nodes while preserving auditability
      across distributed trust boundaries.
    approach: >
      Implemented blockchain-governed token lifecycle controls and enforced least
      privilege with threat-model-driven policy rules.
    outcome: >
      Delivered verifiable access decisions, stronger accountability, and practical
      governance for distributed IoT communication.
    metrics:
      - Smart-contract authorization layer
      - Token lifecycle governance
      - Threat-model-based policy design

  - category: Security Benchmarking
    title: Lightweight Hash Benchmarking with ChipWhisperer
    url: /projects/benchmarking_lwhf_chipwhisperer/
    challenge: >
      Generate practical evidence for selecting cryptographic primitives on deeply
      constrained embedded IoT platforms.
    approach: >
      Benchmarked lightweight hash candidates on AVR using reproducible measurement
      workflows and comparative evaluation criteria.
    outcome: >
      Produced a decision-ready reference balancing security strength, performance
      cost, and deployment feasibility.
    metrics:
      - 130+ primitives benchmarked
      - Reproducible AVR pipeline
      - Security-performance trade-off matrix

  - category: Industry Security Ops
    title: Datacom Cyber Security Operations Simulation
    url: /projects/forage_datacom/
    challenge: >
      Assess a ransomware scenario and produce defensible risk decisions across
      technical and business contexts.
    approach: >
      Mapped attack evidence, quantified impact, prioritized risks, and translated
      findings into operational control actions.
    outcome: >
      Demonstrated SOC-ready triage, clear stakeholder communication, and actionable
      response planning for operations.
    metrics:
      - Ransomware impact analysis
      - Risk-prioritization workflow
      - Executive decision reporting

threat_map:
  title: Signature View - Attack -> Control -> Signal
  intro: Threat-to-defense map across core intrusion stages.
  stages:
    - stage: Recon
      attack: OSINT, exposed assets.
      control: ASM, hardening.
      signal: Exposure alerts.
    - stage: Initial Access
      attack: Phishing, exploit creds.
      control: MFA, patching.
      signal: Risky login.
    - stage: Privilege Escalation
      attack: Role abuse, token theft.
      control: Least privilege, RBAC.
      signal: Role anomalies.
    - stage: Lateral Movement
      attack: Cred reuse, remote pivot.
      control: Segmentation, JIT.
      signal: East-west anomalies.
    - stage: Impact and Response
      attack: Ransomware, exfiltration.
      control: Immutable backups, IR playbooks.
      signal: Encryption alerts.

