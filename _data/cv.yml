        - Practiced incident investigation, triage, and clear communication under realistic constraints.

    - title: Healthcare Data Security & HIPAA Risk Assessment
      year: Dec 2025
      description:
        - Reviewed policies and workflows to identify CIA risks to patient data and map gaps to HIPAA Security Rule requirements.
        - Recommended encryption, backup, and access-control improvements for a small healthcare provider.

    - title: Vulnerability Impact Analysis & Threat Mitigation
      year: Dec 2025
      description:
        - Identified technical/procedural vulnerabilities, assessed likelihood and impact, and prioritized remediation.
