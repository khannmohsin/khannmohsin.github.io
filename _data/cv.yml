- title: Projects
  type: time_table
  contents:
    - title: BlockCap — Blockchain-Based Capability Access Control for IoT Systems
      year: Jan 2024 - Nov 2025
      description:
        - Designed capability-based authorization using smart contracts and validator coordination to enforce least-privilege IoT communication.
        - Implemented token issuance, revocation, expiry, and auditability through blockchain-backed governance.
        - Evaluated latency, resource overhead, and security guarantees using STRIDE threat modeling.

    - title: Lightweight Cryptography Benchmarking & Taxonomy for IoT
      year: Jan 2023 - Sep 2025
      description:
        - Benchmarked 130+ lightweight primitives across AVR and ARM using ChipWhisperer and custom measurement tooling.
        - Analyzed performance, memory footprint, energy cost, and known cryptanalytic properties to quantify trade-offs.
        - Produced a structured taxonomy to guide algorithm selection under device and threat constraints.

    - title: Cloud Security Architecture & Migration Risk Analysis
      year: Dec 2025
      description:
        - Assessed cloud migration risks and security controls for critical systems moving to the cloud.
        - Evaluated IaaS/PaaS/SaaS models and recommended mitigations aligned with the shared responsibility model.

    - title: Deloitte Australia Cyber Job Simulation (Forage)
      year: Dec 2025
